name: Fetch Website Contents

on:
  schedule:
    - cron: '*/10 * * * *'   # هر 10 دقیقه یک بار
  workflow_dispatch:         # اجرای دستی

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # actions/checkout@v4 از Node.js 22 استفاده می‌کند

      - name: Set up Python
        uses: actions/setup-python@v5
        # setup-python@v5 از Node.js 22 استفاده می‌کند
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run fetch script
        run: python fetch_pages.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetched_contents/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update webpage contents [skip ci]"
          git push
