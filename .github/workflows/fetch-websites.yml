name: Fetch Website Contents

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← اضافه کنید

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4     # نسخه 4 با Node24 کار می‌کند

      - name: Set up Python
        uses: actions/setup-python@v5 # نسخه 5 با Node24 کار می‌کند
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run fetch script
        run: python fetch_pages.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update webpage contents [skip ci]"
          git push
